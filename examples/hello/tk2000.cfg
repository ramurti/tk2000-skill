# Um arquivo de programa carregado em $4000 (as páginas 1 da hi-res em $2000 e 2 em $A000 ficam livres).
MEMORY {
    MAIN: start = $4000, size = $6000, file = %O;
}
SEGMENTS {
    CODE:   load = MAIN, type = ro, start = $4000;     # Start tem de ser o primeiro byte
    RODATA: load = MAIN, type = ro;
}
